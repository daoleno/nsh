name: Mewla embedding SDKs

# Mewla's apps embed NSH from one commit of this line (mewla/*): the Mac app's crates by rev, the Android
# AARs and the iOS XCFrameworks from here. Each commit pushed to the line gets the two embedding archives
# release.yml makes (nsh-embed-android.zip, nsh-embed-ios.zip) and the CLI archives of the machines Mewla
# builds on (nsh-linux-x86_64.tar.gz, nsh-macos-arm64.tar.gz), so the CLI that bundles and type checks an
# app knows the props and capabilities the runtime it embeds reads. They are built here once and published
# as the prerelease mewla-<commit>, which Mewla's client/scripts/fetch-nsh.sh downloads and checks against
# the checksums it pins. A commit that already has its release is not built again.
on:
  push:
    branches: ["mewla/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mewla-embed-${{ github.sha }}

env:
  TAG: mewla-${{ github.sha }}

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.check.outputs.build }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assets=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' 2>/dev/null || true)
          build=false
          for asset in nsh-embed-android.zip nsh-embed-ios.zip nsh-linux-x86_64.tar.gz nsh-macos-arm64.tar.gz; do
            grep -qx "$asset" <<<"$assets" || build=true
          done
          echo "build=$build" >> "$GITHUB_OUTPUT"

  android:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install the Android platform
        run: |
          if [[ ! -f "$ANDROID_HOME/platforms/android-35/android.jar" ]]; then
            sdkmanager=$(ls "$ANDROID_HOME"/cmdline-tools/latest/bin/sdkmanager* | head -1)
            yes | "$sdkmanager" "platforms;android-35" > /dev/null || true
          fi
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          ls "$ANDROID_HOME/ndk"
      - name: Build the AARs
        env:
          CARGO_PROFILE_RELEASE_LTO: thin
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
        run: cargo xtask android-embed
      - name: Package
        run: |
          mkdir -p out/nsh-embed-android
          cp dist/nsh/embed/android/nsh.aar dist/nsh/embed/android/nsh-dev.aar out/nsh-embed-android/
          cd out && zip -qry nsh-embed-android.zip nsh-embed-android
      - uses: actions/upload-artifact@v4
        with:
          name: nsh-embed-android
          path: out/nsh-embed-android.zip
          if-no-files-found: error

  ios:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - name: Check the Apple SDKs
        run: |
          xcodebuild -version
          for sdk in iphoneos iphonesimulator; do
            version=$(xcrun --sdk "$sdk" --show-sdk-version)
            echo "$sdk SDK: $version"
            (( ${version%%.*} >= 26 )) || { echo "::error::$sdk SDK 26 or newer is required"; exit 1; }
          done
      - name: Build the XCFrameworks
        env:
          CARGO_PROFILE_RELEASE_LTO: thin
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
        run: cargo xtask ios-embed
      - name: Package
        run: |
          mkdir -p out/nsh-embed-ios
          cp -R dist/nsh/embed/ios/. out/nsh-embed-ios/
          cd out && zip -qry nsh-embed-ios.zip nsh-embed-ios
      - uses: actions/upload-artifact@v4
        with:
          name: nsh-embed-ios
          path: out/nsh-embed-ios.zip
          if-no-files-found: error

  # The CLI as release.yml's dist job builds and packs it, for the two machines Mewla builds on: the CLI
  # and this machine's runtime; other platforms' runtimes are components, left out as there.
  cli:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-24.04
          - name: macos-arm64
            os: macos-26
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    env:
      ARCHIVE: nsh-${{ matrix.name }}
    steps:
      - uses: actions/checkout@v6
      - name: Set up the environment
        run: |
          mkdir -p "$RUNNER_TEMP/tmp"
          echo "TMPDIR=$RUNNER_TEMP/tmp" >> "$GITHUB_ENV"
      - name: Install clang, GTK 4 and GPUI's libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm libclang-dev libgtk-4-dev libwebkitgtk-6.0-dev \
            libfontconfig-dev libfreetype-dev libwayland-dev libx11-xcb-dev libxcb1-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libzstd-dev libgtk-3-dev libwebkit2gtk-4.1-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
      - name: Build the distribution
        env:
          CARGO_PROFILE_RELEASE_LTO: thin
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
          NSH_CHANNEL: stable
          NSH_DIST_NO_ANDROID: "1"
          NSH_DIST_NO_WEB: "1"
        run: cargo xtask dist -v
      # The packaged CLI makes and bundles a new app.
      - name: Smoke test
        run: |
          nsh=dist/nsh/bin/nsh
          "$nsh" --version
          app="$RUNNER_TEMP/smoke-app"
          "$nsh" init "$app"
          "$nsh" build "$app" -o "$RUNNER_TEMP/smoke-out" --release
          ls "$RUNNER_TEMP/smoke-out"
      - name: Package
        run: |
          rm -rf out && mkdir -p out && cd out
          cp -R ../dist/nsh nsh
          cp ../README.md ../LICENSE-APACHE nsh/
          rm -rf nsh/embed
          nsh/bin/nsh component pack --out .
          rm -f nsh-*.tar.gz
          tar -czf "$ARCHIVE.tar.gz" nsh
          rm -rf nsh
          ls -l
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARCHIVE }}
          path: out/${{ env.ARCHIVE }}.tar.gz
          if-no-files-found: error

  publish:
    needs: [android, ios, cli]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Publish mewla-<commit>
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd assets
          assets=(nsh-embed-android.zip nsh-embed-ios.zip nsh-linux-x86_64.tar.gz nsh-macos-arm64.tar.gz)
          sha256sum "${assets[@]}" | tee SHA256SUMS
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1 || \
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
              --title "$TAG" --notes "NSH embedding SDKs and CLIs for Mewla, built from $GITHUB_SHA ($GITHUB_REF_NAME)."
          gh release upload "$TAG" "${assets[@]}" SHA256SUMS --repo "$GITHUB_REPOSITORY" --clobber
